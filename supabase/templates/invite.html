<!doctype html>
<html lang="it">
<body style="margin:0;padding:40px 20px;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a">
  <div style="max-width:560px;margin:auto;padding:40px;background:#fff;border:1px solid #e2e8f0;border-radius:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid #e2e8f0">
      <img src="https://www.merakiexperience.org/images/logo-meraki.png" width="150" alt="Meraki Experience" style="display:block;width:150px;height:auto">
      <span style="padding:7px 10px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">Invito</span>
    </div>
    <h1 style="margin:0 0 12px;font-size:25px">Benvenuto in Meraki</h1>
    <p style="margin:0 0 26px;color:#475569;font-size:15px;line-height:1.65">Hai ricevuto un invito per accedere all’area riservata Meraki Experience. Usa il pulsante per accettarlo e impostare il tuo accesso.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#0f172a;color:#fff;text-decoration:none;font-size:14px;font-weight:650">Accetta l’invito</a>
    <p style="margin:26px 0 0;color:#94a3b8;font-size:12px;line-height:1.6">Se non ti aspettavi questo invito, puoi ignorare questa email.</p>
    <div style="margin-top:30px;padding-top:20px;border-top:1px solid #e2e8f0;color:#94a3b8;font-size:11px">ASD Meraki Experience · Bolzano · merakiexperience.org</div>
  </div>
</body>
</html>
