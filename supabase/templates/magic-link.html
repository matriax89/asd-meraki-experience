<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codice di accesso Meraki</title>
  </head>
  <body style="margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a;">
    <table role="presentation" style="width:100%;border-collapse:collapse;">
      <tr>
        <td style="padding:32px 16px;">
          <table role="presentation" style="width:100%;max-width:480px;margin:auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;">
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 24px;font-size:14px;font-weight:bold;">ASD Meraki Experience</p>
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Il tuo codice di accesso</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#475569;">Inserisci questo codice nella pagina di accesso all’area riservata:</p>
                <p style="margin:0 0 24px;padding:20px;background:#f1f5f9;border-radius:12px;text-align:center;font-family:monospace;font-size:32px;font-weight:bold;letter-spacing:6px;">{{ .Token }}</p>
                <p style="margin:0;font-size:14px;line-height:1.6;color:#64748b;">Il codice è utilizzabile una sola volta. Non condividerlo con altre persone. Se non hai richiesto l’accesso, puoi ignorare questa email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
